<div class="bg-neon-leaf border-2 border-secondary shadow-[5px_5px_0_0_var(--color-shadow)] md:shadow-[7px_7px_0_0_var(--color-shadow)] px-4 md:px-6 py-4 md:py-8">
  <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 md:gap-8">
    <!-- Left Section: Title and Owner -->
    <div class="flex flex-col gap-1">
      <p class="text-xs md:text-sm text-text-secondary">
        Made with <span class="text-scarlet-rush text-sm md:text-base">❤️</span> by Adelya Musaeva
      </p>
      <h1 class="text-2xl md:text-4xl font-bold text-text-primary wrap-break-word">{{ title() }}</h1>
    </div>

    <!-- Right Section: Collaborators and Invite Button -->
    <div class="flex items-center gap-3 md:gap-6 w-full md:w-auto">
      <!-- Collaborators Avatars Stack -->
      @if (collaborators().length > 0) {
        <div class="flex items-center">
          @for (collaborator of collaborators().slice(0, 4); track collaborator.id; let i = $index) {
            <img
              [src]="collaborator.photoURL"
              [alt]="collaborator.displayName"
              [title]="collaborator.displayName"
              [class]="'w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-secondary object-cover bg-primary transition-transform hover:scale-110 hover:-translate-y-1 hover:z-10 ' + (i > 0 ? '-ml-2 md:-ml-3' : '')"
            />
          }
          @if (collaborators().length > 4) {
            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-secondary bg-sky-mint flex items-center justify-center text-sm md:text-lg -ml-2 md:-ml-3">
              +{{ collaborators().length - 4 }}
            </div>
          }
        </div>
      }

      <!-- Invite Button -->
      <button
        class="flex items-center gap-2 px-4 md:px-6 py-2 md:py-3 bg-accent border-2 border-secondary rounded shadow-[3px_3px_0_0_var(--color-secondary)] md:shadow-[5px_5px_0_0_var(--color-secondary)] text-sm md:text-lg transition-all hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0_0_var(--color-secondary)] md:hover:shadow-[3px_3px_0_0_var(--color-secondary)] cursor-pointer"
        (click)="inviteClicked.emit()"
      >
        <ng-icon name="heroUserPlusSolid" size="1.25rem" class="md:text-2xl"></ng-icon>
        <span class="hidden sm:inline">Invite People</span>
        <span class="sm:hidden">Invite</span>
      </button>
    </div>
  </div>
</div>
